[project]
name = "ai-ethics-law-mini-project"
version = "0.1.0"
description = "Mini-projekt — Aspekty prawne, społeczne i etyczne w AI (PWr 2025/2026)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.82",
    "anthropic>=0.52",
    "google-genai>=1.14",
    "loguru>=0.7",
    "python-dotenv>=1.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "huggingface-hub>=1.14.0",
    "datasets>=3.5.0",
    "transformers>=4.53.0",
    "accelerate>=1.7.0",
    "jupyter>=1.1.1",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
gpu = [
    "bitsandbytes>=0.43.0",
]
